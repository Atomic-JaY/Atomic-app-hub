<style>
:root{
  color-scheme: light dark;
  --ink:#141a26; --muted:#5b6474; --line:#d9dde4; --bg:#f4f5f7; --card:#fff;
  --navy:#1f2a44; --navy-2:#2b3a5e; --red:#c8102e; --amber:#f2a900; --green:#1e7a46; --grey:#6b7280;
  --red-bg:#fde8eb; --amber-bg:#fff4d6; --green-bg:#e3f3e9; --grey-bg:#eceef2;
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#e8ebf1; --muted:#9aa3b2; --line:#2c3445; --bg:#0f141d; --card:#171e2a;
         --red-bg:#3a1a20; --amber-bg:#3a3018; --green-bg:#16301f; --grey-bg:#232a37; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.45}
a{color:inherit}
header.top{background:var(--navy);color:#fff}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.top-in img{width:30px;height:30px;border-radius:6px;background:#fff;flex:none}
.top-in b{display:block;font-size:16px;line-height:1.15}
.top-in small{display:block;font-size:12px;opacity:.75}
.top-in a.all{margin-left:auto;color:#fff;font-size:14px;opacity:.85;white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:16px}
.msg{padding:28px 0;color:var(--muted);text-align:center}

.kind{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
h1{font-size:40px;line-height:1;margin:4px 0 6px}
.loc{font-size:17px}
.sub{font-size:14px;color:var(--muted);margin-top:2px}

.verdict{margin:16px 0 14px;border-radius:14px;padding:14px 16px;border:2px solid;display:flex;gap:12px;align-items:center}
.verdict .ic{font-size:30px;line-height:1;flex:none;width:36px;text-align:center}
.verdict b{font-size:22px;display:block;line-height:1.15}
.verdict span{font-size:15px}
.ok   {--c:var(--green);--cb:var(--green-bg)}
.soon {--c:var(--amber);--cb:var(--amber-bg)}
.over {--c:var(--red);  --cb:var(--red-bg)}
.unknown{--c:var(--grey);--cb:var(--grey-bg)}
.verdict{border-color:var(--c);background:var(--cb)}

.photos{display:flex;gap:8px;margin:0 0 14px}
.photos a{flex:1;display:block;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--card);position:relative;max-width:50%}
.photos img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.photos span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 7px;border-radius:6px}

h2{font-size:15px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:20px 0 8px}
.check{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.check .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.check .n{font-weight:600}
.chip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--c);color:#fff;white-space:nowrap}
.soon .chip{color:#111}
.check .d{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:14px;margin-top:4px}
.check .d small{display:block;color:var(--muted);font-size:12px}
.check .ref{font-size:12px;color:var(--muted);margin-top:4px}

table.hist{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hist th,.hist td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.hist th{font-size:12px;color:var(--muted);font-weight:600}
.hist tr:last-child td{border-bottom:none}
.hist .fail{color:var(--red);font-weight:700}
.hist .pass{color:var(--green);font-weight:700}
.hist td.dt{white-space:nowrap}
.hist .note{font-size:13px;color:var(--muted)}
.docs a{display:inline-block;margin:0 8px 8px 0;padding:9px 14px;border-radius:9px;background:var(--navy);color:#fff;text-decoration:none;font-size:15px}

.asof{margin-top:20px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.asof a{color:var(--muted)}

/* all-devices list */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}
.sum div{background:var(--cb);border:1.5px solid var(--c);border-radius:10px;padding:8px;text-align:center}
.sum b{display:block;font-size:24px;line-height:1.1}
.sum span{font-size:12px}
.list{display:grid;gap:6px;grid-template-columns:minmax(0,1fr)}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:8px 10px;text-decoration:none}
.row b{min-width:50px}
.row .wk{font-weight:800;width:16px;text-align:center}
.row .wk.p{color:var(--green)} .row .wk.f{color:var(--red)}

/* logging an inspection from the QR page */
.insp{background:var(--card);border:2px solid var(--navy-2);border-radius:14px;padding:12px 14px;margin:0 0 14px}
.insp .ih{font-weight:700;font-size:17px}
.insp .guide{font-size:14px;color:var(--muted);margin:4px 0 8px}
.insp .who{font-size:14px;margin-bottom:8px}
.insp input,.insp textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);margin-bottom:8px}
.insp .imsg{color:var(--red);font-size:14px;min-height:0}
.insp .ibtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.insp .ibtns button{font:inherit;font-size:19px;font-weight:700;padding:14px;border:none;border-radius:11px;color:#fff;cursor:pointer}
.insp .ibtns .pass{background:var(--green)} .insp .ibtns .fail{background:var(--red)}
.insp.logged{border-color:var(--green);background:var(--green-bg);display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start}
.insp.logged.fail{border-color:var(--red);background:var(--red-bg)}
.insp.logged b{font-size:17px} .insp.logged span{font-size:14px;grid-column:1}
.insp.logged .lnk{grid-column:2;grid-row:1}
.lnk{background:none;border:none;color:inherit;text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;padding:0}
.inspOpen{display:block;width:100%;margin-top:14px;font:inherit;font-size:15px;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.saved{background:var(--green-bg);border:2px solid var(--green);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:15px}
.saved b{display:block;font-size:17px;margin-bottom:4px}
.saved ol{margin:6px 0 0;padding-left:20px}
.walkbar{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;z-index:20;box-shadow:0 -4px 14px rgba(0,0,0,.25)}
.walkbar .in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.walkbar .c{flex:1;min-width:150px;font-size:14px}
.walkbar .c b{font-size:16px}
.walkbar .f{color:#ffb3b4;font-weight:700}
.walkbar button,.walkbar a{font:inherit;font-size:15px;font-weight:600;padding:9px 13px;border-radius:9px;border:none;cursor:pointer;text-decoration:none;white-space:nowrap}
.walkbar .sv{background:#fff;color:var(--navy)} .walkbar .rv{background:var(--navy-2);color:#fff}
.walkbar .dc{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.walkbar .armed{background:var(--red);color:#fff}
body.walking main{padding-bottom:90px}
.row .l{flex:1;min-width:0;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = new Date();
const TODAY = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
const iso = d => d.toISOString().slice(0,10);
const toDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); };
const addDays = (d,n) => { const r = new Date(d); r.setUTCDate(r.getUTCDate()+n); return r; };
const days = (a,b) => Math.round((b-a)/86400000);
const short = s => s ? toDate(s).toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric',timeZone:'UTC'}) : '—';
const fmt = s => s ? toDate(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}) : '—';
const LABEL = {ok:'Compliant', soon:'Due soon', over:'Overdue', unknown:'Not logged'};

function cellDate(v){
  if(v == null || v === '') return null;
  if(v instanceof Date && !isNaN(v)) return iso(new Date(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate())));
  if(typeof v === 'number'){ const d = new Date(Math.round((v-25569)*86400000)); return isNaN(d) ? null : iso(d); }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(m) return iso(new Date(Date.UTC(+m[3], +m[1]-1, +m[2])));
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);        if(m) return iso(new Date(Date.UTC(+m[1], +m[2]-1, +m[3])));
  return null;
}

// Same reading rules as the full tracker: a header row with "XX #", every Last/Next
// column pair is a check, "N/A" in a Next cell means the check does not apply.
function parse(wb){
  const out = {};
  wb.SheetNames.forEach(name => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:''});
    let hi = -1, type = null;
    for(let i = 0; i < rows.length && hi < 0; i++)
      for(const c of rows[i]){
        const t = Object.keys(TABS).find(k => String(c).trim().toUpperCase() === TABS[k]);
        if(t){ hi = i; type = t; break; }
      }
    if(hi < 0) return;
    const h = rows[hi].map(x => String(x).trim().toLowerCase());
    const col = n => h.indexOf(n);
    const pairs = [];
    h.forEach((x, i) => {
      const m = x.match(/^next\s+(.+)$/); if(!m) return;
      const li = col('last ' + m[1].trim()); if(li < 0) return;
      pairs.push({name: m[1].trim().replace(/\b\w/g, c => c.toUpperCase()), ni:i, li});
    });
    const sub = ['type','model','serial number'].map(col);
    for(let i = hi+1; i < rows.length; i++){
      const r = rows[i], id = String(r[col(TABS[type].toLowerCase())] ?? '').trim().toUpperCase();
      if(!/^(FE|EL|EW|AED)\d+$/.test(id)) continue;
      out[id] = {type, location: String(r[col('near location')] ?? '').trim(),
        detail: sub.filter(j => j >= 0 && r[j] !== '').map((j, k) => (h[j] === 'serial number' ? 'SN ' : '') + r[j]).join(' · '),
        checks: pairs.map(p => String(r[p.ni] ?? '').trim().toUpperCase() === 'N/A' ? null
                 : {name:p.name, last:cellDate(r[p.li]), next:cellDate(r[p.ni])}).filter(Boolean)};
    }
  });
  return out;
}

function readHistory(wb){
  const ws = wb.Sheets['Inspection History']; if(!ws) return [];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
  const hi = rows.findIndex(r => { const h = r.map(x => String(x).trim().toLowerCase()); return h.includes('device') && h.includes('date'); });
  if(hi < 0) return [];
  const h = rows[hi].map(x => String(x).trim().toLowerCase()), c = n => h.indexOf(n);
  return rows.slice(hi+1).map(r => ({date: cellDate(r[c('date')]), dev: String(r[c('device')] ?? '').trim().toUpperCase(),
    check: String(r[c('check')] ?? '').trim(), result: String(r[c('result')] ?? '').trim(),
    by: String(r[c('inspected by')] ?? '').trim(), note: String(r[c('notes')] ?? '').trim(),
    logged: c('logged at') < 0 ? '' : String(r[c('logged at')] ?? '').trim()}))
    .filter(x => x.date && x.dev);
}

function applyHistory(found, hist, wb){
  const iv = wb.Sheets['Intervals'];
  Object.values(ROUTINE).forEach(r => { const v = iv && iv[r.cell] && iv[r.cell].v; if(typeof v === 'number' && v > 0) r.days = v; });
  const latest = {}, who = {};
  hist.forEach(x => {
    if(x.result.toLowerCase() !== 'pass') return;
    const k = x.dev + '|' + x.check.toLowerCase();
    who[k + '|' + x.date] = x.by;
    if(!latest[k] || x.date > latest[k].date) latest[k] = x;
  });
  Object.entries(found).forEach(([id, d]) => d.checks.forEach(c => {
    const k = id + '|' + c.name.toLowerCase(), x = latest[k], r = ROUTINE[d.type];
    if(r && x && c.name.toLowerCase() === r.check.toLowerCase() && (!c.last || x.date > c.last)){
      c.last = x.date; c.next = iso(addDays(toDate(x.date), r.days));
    }
    c.by = c.last ? (who[k + '|' + c.last] || '') : '';
  }));
}

// Worst check wins; nearest due date breaks a tie.
function status(d){
  const RANK = {over:0, soon:1, ok:2};
  d.checks.forEach(c => {
    c.days = c.next ? days(TODAY, toDate(c.next)) : null;
    const win = SOON_BY[c.name] ?? SOON[d.type];
    c.status = c.days === null ? 'unknown' : c.days <= 0 ? 'over' : c.days <= win ? 'soon' : 'ok';
  });
  const dated = d.checks.filter(c => c.days !== null);
  if(!dated.length) return {status:'unknown', worst:null};
  const worst = dated.reduce((a,b) => RANK[b.status] !== RANK[a.status] ? (RANK[b.status] < RANK[a.status] ? b : a) : (b.days < a.days ? b : a));
  return {status: worst.status, worst};
}

const nice = n => (CHECKS[n] || [n])[0];
function dueText(c){
  if(c.days === null) return 'No date logged';
  if(c.days < 0) return Math.abs(c.days) + ' day' + (c.days === -1 ? '' : 's') + ' overdue';
  if(c.days === 0) return 'Due today';
  return 'Due in ' + c.days + ' day' + (c.days === 1 ? '' : 's');
}

    : st === 'unknown' ? 'No inspection dates logged yet'
    : nice(worst.name) + ' — ' + dueText(worst).toLowerCase();
  const mine = hist.filter(x => x.dev === id).sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0).slice(0, 8);
  const photo = (suf, label) => `<a href="photos/${id}${suf}.jpg" target="_blank"><img src="photos/${id}${suf}.jpg" alt="${label}" loading="lazy" onerror="this.parentNode.remove()"><span>${label}</span></a>`;
  document.title = id + ' — ' + LABEL[st] + ' · Atomic Industries';
  document.getElementById('main').innerHTML = `

    <div class="loc">${esc(d.location || dev.loc || '')}</div>
    ${d.detail ? `<div class="sub">${esc(d.detail)}</div>` : ''}
    <div class="verdict ${st}"><div class="ic">${icon}</div><div><b>${LABEL[st]}</b><span>${esc(headline)}</span></div></div>
    ${savedHtml()}${inspectorMode(id) ? `<div id="inspSlot">${inspectHtml(id, d.type)}</div>` : ''}
    <div class="photos">${photo('', 'Unit')}${photo('-loc', 'Location')}</div>
    ${DOCS[id] ? `<div class="docs">${DOCS[id].map(([n,u]) => `<a href="${u}" target="_blank">📄 ${esc(n)}</a>`).join('')}</div>` : ''}
    <h2>Required checks</h2>
    ${d.checks.map(c => {
      const cons = CONSUMABLE.has(c.name);
      return `<div class="check ${c.status}"><div class="t"><span class="n">${esc(nice(c.name))}</span><span class="chip">${LABEL[c.status]}</span></div>
      <div class="d"><div><small>${cons ? 'Installed' : 'Last done'}</small>${!c.last && c.next && /internal|hydro/i.test(c.name) ? 'None yet (counted from mfd. date)' : fmt(c.last)}${c.by ? ' · ' + esc(c.by) : ''}</div>
      <div><small>${cons ? 'Replace by' : 'Next due'}</small>${fmt(c.next)}</div></div>
      <div class="ref">${esc(dueText(c))} · ${esc((CHECKS[c.name] || [,''])[1])}</div></div>`;
    }).join('') || '<div class="msg">No checks set up for this device.</div>'}
    <h2>Recent inspections</h2>
    ${mine.length ? `<table class="hist"><tr><th>Date</th><th>Check</th><th>Result</th><th>By</th></tr>${mine.map(x => `
      <tr><td class="dt">${short(x.date)}${(x.logged.match(/\d{1,2}:\d{2}\s?[AP]M/i) || [''])[0] ? `<div class="note">${esc(x.logged.match(/\d{1,2}:\d{2}\s?[AP]M/i)[0])}${/qr/i.test(x.logged) ? ' · scan' : ''}</div>` : ''}</td><td>${esc(nice(x.check))}${/fail/i.test(x.result) && x.note ? `<div class="note">${esc(x.note)}</div>` : ''}</td>
      <td class="${/pass/i.test(x.result) ? 'pass' : /fail/i.test(x.result) ? 'fail' : ''}">${esc(x.result)}</td><td>${esc(x.by || '—')}</td></tr>`).join('')}</table>`
      : '<div class="msg">No inspections on record yet.</div>'}
    ${!inspectorMode(id) && STATE.scanned === id ? '<button class="inspOpen" data-act="open">Inspector? Log an inspection</button>' : ''}
    <div class="asof">${asOf} Inspections are logged by scanning the QR label on the device itself.<br><a href="./#${encodeURIComponent(id)}">Show ${esc(id)} on the plant map</a> (large page)</div>`;

}

function renderList(found, asOf){
  const rows = DEVICES.map(x => ({...x, st: found[x.id] ? status(found[x.id]).status : 'unknown'}));
  const n = k => rows.filter(r => r.st === k).length;
  const n0 = Object.keys(WALK.entries).length;
  const badge = id => { const e = WALK.entries[id]; return e ? `<span class="wk ${e.result === 'Pass' ? 'p' : 'f'}">${e.result === 'Pass' ? '✓' : '✗'}</span>` : ''; };
  document.getElementById('main').innerHTML = `
    ${savedHtml()}
    <div class="kind">All life safety devices</div><h1 style="font-size:28px">${rows.length} devices</h1>
    ${n0 ? `<div class="msg" style="padding:0 0 10px;text-align:left">This walk so far: ${Object.keys(KIND).map(t => `${t} <b>${rows.filter(r => r.type === t && WALK.entries[r.id]).length}/${rows.filter(r => r.type === t).length}</b>`).join(' · ')}. ✓ and ✗ mark what you have logged.</div>` : ''}
    <div class="sum">${['over','soon','ok','unknown'].map(k => `<div class="${k}"><b>${n(k)}</b><span>${LABEL[k]}</span></div>`).join('')}</div>
    ${Object.keys(KIND).map(t => `<h2>${KIND[t]}s</h2><div class="list">${rows.filter(r => r.type === t).map(r => `
      <a class="row ${r.st}" href="device.html?${r.id}">${badge(r.id)}<b>${r.id}</b><span class="l">${esc((found[r.id] || {}).location || r.loc)}</span><span class="chip">${LABEL[r.st]}</span></a>`).join('')}</div>`).join('')}
    <div class="asof">${asOf}</div>`;
  walkBar();
}

(async function(){
  // ?FE7, ?id=FE7 and #FE7 all work, so a label printed either way still scans.
  const q = decodeURIComponent((location.search.slice(1).replace(/^id=/i, '') || location.hash.slice(1)).split('&')[0]).trim().toUpperCase();
  const main = document.getElementById('main');
  let wb = null, modified = null;
  STATE.q = q;
  const k = (location.search.match(/[?&]k=([a-z0-9]+)/i) || [])[1];
  if(q && k){
    try{
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(q + ':' + k.toLowerCase()));
      const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
      if(KEY_HASHES[q] && KEY_HASHES[q] === hex) STATE.scanned = q;
    }catch(e){}
    // the code is proof of one scan, not a bookmark: drop it from history
    history.replaceState(null, '', 'device.html?' + encodeURIComponent(q));
  }
  for(const name of WORKBOOKS){
    try{
      const res = await fetch(encodeURI(name), {cache:'no-store'});
      if(!res.ok) continue;
      modified = res.headers.get('last-modified');
      STATE.bytes = new Uint8Array(await res.arrayBuffer());
      wb = XLSX.read(STATE.bytes, {type:'array', cellDates:true});
      break;
    }catch(e){}
  }
  if(!wb){ main.innerHTML = '<div class="msg">Could not load the inspection log. Check your signal and try again.</div>'; return; }
  const found = parse(wb), hist = readHistory(wb);
  applyHistory(found, hist, wb);
  const latest = hist.reduce((m, x) => x.date > m ? x.date : m, '');
  const asOf = 'Live from the PM log' + (modified ? ', last updated ' + new Date(modified).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '') +
    (latest ? '. Latest inspection on record: ' + fmt(latest) + '.' : '.') + ' Checked ' + fmt(iso(TODAY)) + '.';
  Object.assign(STATE, {found, hist, asOf});
  if(!q){ document.getElementById('allLink').style.display = 'none'; renderList(found, asOf); return; }
  if(!found[q]){ main.innerHTML = `<div class="msg">No device called <b>${esc(q)}</b> in the log. <a href="device.html">See all devices</a>.</div>`; return; }
  renderDevice(q, found[q], hist, asOf);
})();

// ───────────────────────── logging from the QR page ─────────────────────────
// A scan opens this page; an inspector taps Pass or Fail for the device's routine
// check. Entries go into the same walk the plant map's Walk mode keeps
// (localStorage "lspm-walk" on this site), so a walk can be started on the map and
// finished by scanning, or the other way round. Save appends the walk to the
// Inspection History tab exactly as the map does and downloads the updated log.
// Nothing reaches the live site until that file is uploaded.
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
const WALK = {entries: ((store.get('lspm-walk') || {}).entries) || {}};
const walkSave = () => store.set('lspm-walk', {entries: WALK.entries});
const inspector = () => (store.get('lspm-inspector') || '').trim();
// Panel shows at the top for anyone who has logged on this phone before; everyone
// else (an auditor scanning a label) gets a single button at the bottom instead.
const inspectorMode = id => !!WALK.entries[id] ||
  (STATE.scanned === id && (!!inspector() || STATE.openInsp === id));
const GUIDE = {
  FE: 'Gauge in the green · pin and tamper seal intact · no dents, rust or leaks · hose and nozzle clear · mounted, visible, nothing blocking it',
  EL: 'Hold the test button 30 seconds · both lamps stay lit the whole time · housing and lenses undamaged',
  EW: 'Activate it: covers pop off, both heads flow evenly, water runs clear · tank full · area clear and sign visible',
  AED: 'Ready indicator showing · no service alert · pads and battery in date · rescue kit present · cabinet closed',
};
const TYPE_ORDER = Object.keys(KIND);

function inspectHtml(id, type){
  const e = WALK.entries[id], who = inspector();
  if(e) return `<div class="insp logged ${e.result === 'Fail' ? 'fail' : ''}">
      <b>${e.result === 'Pass' ? '✓ Pass' : '✗ Fail'} logged · ${esc(nice(e.check))}</b>
      <button class="lnk" data-act="undo">Undo</button>
      <span>${esc(e.logged || short(e.date))} · ${esc(e.by)}${e.note ? ' · ' + esc(e.note) : ''}<br>Saved on this phone. Scan the next label, then tap <b>Save to log</b> at the end.</span></div>`;
  return `<div class="insp"><div class="ih">Log today's ${esc(nice(ROUTINE[type].check).toLowerCase())}</div>
    <div class="guide">${esc(GUIDE[type])}</div>
    ${who ? `<div class="who">Inspector: <b>${esc(who)}</b> · <button class="lnk" data-act="who">change</button></div>`
          : '<input id="iWho" placeholder="Your name (asked once, remembered on this phone)" autocomplete="name">'}
    <textarea id="iNote" rows="2" placeholder="Note (required on a Fail: say what is wrong)"></textarea>
    <div class="imsg" id="iMsg"></div>
    <div class="ibtns"><button class="pass" data-act="pass">✓ Pass</button><button class="fail" data-act="fail">✗ Fail</button></div></div>`;
}

function savedHtml(){
  const s = STATE.saved; if(!s) return '';
  return `<div class="saved"><b>Saved ${s.n} inspection${s.n === 1 ? '' : 's'}${s.fails ? ` (${s.fails} failed)` : ''} to the log</b>
    Your phone downloaded <b>Life-Safety-PM-Log.xlsx</b>. Only this phone shows the walk until that file is published:
    <ol><li>Upload it on GitHub: Atomic-app-hub → life-safety → Add file → Upload files → Commit changes, <i>or</i></li>
    <li>Put it in the Emergency Device Log share folder (as <i>Life Safety PM Log.xlsx</i>) and have Claude upload it.</li></ol></div>`;
}

function walkBar(){
  let bar = document.getElementById('walkbar');
  const list = Object.values(WALK.entries), n = list.length;
  document.body.classList.toggle('walking', n > 0);
  if(!n){ if(bar) bar.remove(); return; }
  if(!bar){ bar = document.createElement('div'); bar.id = 'walkbar'; bar.className = 'walkbar'; document.body.appendChild(bar); }
  const fails = list.filter(e => e.result === 'Fail').length;
  bar.innerHTML = `<div class="in"><div class="c"><b>${n} logged</b> on this walk${fails ? ` · <span class="f">${fails} failed</span>` : ''}<br>not yet saved to the log</div>
    ${STATE.q ? '<a class="rv" href="device.html">Review</a>' : '<button class="dc" data-act="discard">Discard</button>'}
    <button class="sv" data-act="save">Save to log</button></div>`;
}

function rerender(){
  if(STATE.q && STATE.found[STATE.q]) renderDevice(STATE.q, STATE.found[STATE.q], STATE.hist, STATE.asOf);
  else renderList(STATE.found, STATE.asOf);
}

function saveWalk(){
  const list = Object.values(WALK.entries).sort((a, b) =>
    TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type) ||
    (+a.dev.replace(/^\D+/, '')) - (+b.dev.replace(/^\D+/, '')));
  if(!list.length || !STATE.bytes) return;
  let out;
  try{ out = appendHistory(STATE.bytes, list); }
  catch(err){ alertBox('Could not add the walk to the log (' + err.message + '). Nothing was saved; your walk is still on this phone.'); return; }
  const url = URL.createObjectURL(new Blob([out], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  const a = document.createElement('a'); a.href = url; a.download = 'Life-Safety-PM-Log.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  // show the walk straight away, read back from the file just written
  STATE.bytes = out;
  const wb = XLSX.read(out, {type:'array', cellDates:true});
  STATE.found = parse(wb); STATE.hist = readHistory(wb); applyHistory(STATE.found, STATE.hist, wb);
  STATE.saved = {n: list.length, fails: list.filter(e => e.result === 'Fail').length};
  WALK.entries = {}; walkSave();
  rerender(); window.scrollTo(0, 0);
}
function alertBox(t){ const m = document.getElementById('iMsg'); if(m) m.textContent = t; else console.warn(t); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, id = STATE.q, d = id && STATE.found[id];
  if(act === 'open'){ STATE.openInsp = id; rerender(); document.getElementById('inspSlot')?.scrollIntoView({behavior:'smooth', block:'center'}); return; }
  if(act === 'who'){ store.set('lspm-inspector', ''); STATE.openInsp = id; rerender(); return; }
  if(act === 'undo'){ delete WALK.entries[id]; walkSave(); rerender(); return; }
  if(act === 'save'){ saveWalk(); return; }
  if(act === 'discard'){
    if(!b.dataset.armed){ b.dataset.armed = 1; b.classList.add('armed'); b.textContent = 'Tap again to discard';
      setTimeout(() => { if(b.isConnected){ delete b.dataset.armed; b.classList.remove('armed'); b.textContent = 'Discard'; } }, 4000); return; }
    WALK.entries = {}; walkSave(); rerender(); return;
  }
  if(act === 'pass' || act === 'fail'){
    const msg = t => { document.getElementById('iMsg').textContent = t; };
    const iw = document.getElementById('iWho');
    if(iw && iw.value.trim()) store.set('lspm-inspector', iw.value.trim());
    const who = inspector();
    if(!who){ msg('Enter your name first.'); iw && iw.focus(); return; }
    const note = document.getElementById('iNote').value.trim();
    if(act === 'fail' && !note){ msg('A Fail needs a note saying what is wrong.'); document.getElementById('iNote').focus(); return; }
    if(STATE.scanned !== id){ msg('Scan the QR label on ' + id + ' to log it.'); return; }
    const now = new Date();
    const clock = now.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
    WALK.entries[id] = {date: iso(TODAY), dev: id, type: d.type, check: ROUTINE[d.type].check,
                        result: act === 'pass' ? 'Pass' : 'Fail', by: who, note,
                        logged: short(iso(TODAY)) + ' ' + clock + ' · QR scan'};
    walkSave(); STATE.saved = null; rerender();
  }
});
// another tab (the map, or a second scan) may change the walk
window.addEventListener('storage', ev => {
  if(ev.key !== 'lspm-walk' || !STATE.found) return;
  WALK.entries = ((store.get('lspm-walk') || {}).entries) || {}; rerender();
});

const NS_MAIN = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const NS_ODR  = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';

function zipFind(cfb, path){
  const i = cfb.FullPaths.findIndex(p => p.replace(/^[^\/]*\//, '') === path);
  return i < 0 ? null : cfb.FileIndex[i];
}
function zipText(entry){ return new TextDecoder('utf-8').decode(entry.content); }
function zipPut(entry, text){
  const bytes = new TextEncoder().encode(text);
  entry.content = bytes; entry.size = bytes.length;
}
function excelSerial(iso){
  const [y, m, d] = iso.split('-').map(Number);
  return (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000;
}
function colOf(ref){ return ref.replace(/\d+/g, ''); }

function appendHistory(bytes, entries){
  const cfb = XLSX.CFB.read(bytes, {type: 'array'});
  const parse = s => new DOMParser().parseFromString(s, 'application/xml');
  const ser = d => new XMLSerializer().serializeToString(d);

  // workbook.xml names the sheet, its rels file maps the id to a part
  const wbE = zipFind(cfb, 'xl/workbook.xml');
  const wbDoc = parse(zipText(wbE));
  const sheetEl = [...wbDoc.getElementsByTagNameNS(NS_MAIN, 'sheet')]
    .find(s => s.getAttribute('name') === 'Inspection History');
  if(!sheetEl) throw new Error('this workbook has no "Inspection History" tab');
  const rid = sheetEl.getAttributeNS(NS_ODR, 'id');
  const relDoc = parse(zipText(zipFind(cfb, 'xl/_rels/workbook.xml.rels')));
  const rel = [...relDoc.getElementsByTagName('Relationship')].find(r => r.getAttribute('Id') === rid);
  let target = rel.getAttribute('Target');
  target = target.startsWith('/') ? target.slice(1) : 'xl/' + target;
  const shE = zipFind(cfb, target);
  const doc = parse(zipText(shE));
  const sheetData = doc.getElementsByTagNameNS(NS_MAIN, 'sheetData')[0];
  const rows = [...sheetData.getElementsByTagNameNS(NS_MAIN, 'row')];

  // last row that actually holds something, and a style per column copied from
  // the data above it, so new rows look exactly like the old ones
  let last = 5;
  const style = {};
  for(const r of rows){
    const n = +r.getAttribute('r');
    for(const c of r.getElementsByTagNameNS(NS_MAIN, 'c')){
      const col = colOf(c.getAttribute('r'));
      if(n >= 6 && c.getAttribute('s')) style[col] = c.getAttribute('s');
      if(n >= 6 && (c.getElementsByTagNameNS(NS_MAIN, 'v').length ||
                    c.getElementsByTagNameNS(NS_MAIN, 'is').length)) last = Math.max(last, n);
    }
  }
  const byNum = new Map(rows.map(r => [+r.getAttribute('r'), r]));

  entries.forEach((e, k) => {
    const n = last + 1 + k;
    // a styled-but-empty row can already sit at this number; reuse it rather than
    // write a second <row r="n">, which Excel treats as a corrupt file
    let row = byNum.get(n);
    if(row){ while(row.firstChild) row.removeChild(row.firstChild); }
    else {
      row = doc.createElementNS(NS_MAIN, 'row');
      row.setAttribute('r', n);
      const after = [...byNum.keys()].filter(x => x > n).sort((a, b) => a - b)[0];
      sheetData.insertBefore(row, after ? byNum.get(after) : null);
      byNum.set(n, row);
    }
    const cell = (col) => {
      const c = doc.createElementNS(NS_MAIN, 'c');
      c.setAttribute('r', col + n);
      if(style[col]) c.setAttribute('s', style[col]);
      row.appendChild(c);
      return c;
    };
    const v = doc.createElementNS(NS_MAIN, 'v');
    v.textContent = String(excelSerial(e.date));
    cell('A').appendChild(v);
    // G "Logged at": the clock time and how it was logged (QR scan), so a real
    // walk shows a believable spread of times and a desk-bound one does not
    [['B', e.dev], ['C', e.check], ['D', e.result], ['E', e.by], ['F', e.note], ['G', e.logged]].forEach(([col, text]) => {
      if(col === 'G' && !style.G && style.E) style.G = style.E;
      const c = cell(col);
      if(!text) return;
      c.setAttribute('t', 'inlineStr');
      const is = doc.createElementNS(NS_MAIN, 'is');
      const t = doc.createElementNS(NS_MAIN, 't');
      t.textContent = text;
      if(/^\s|\s$/.test(text)) t.setAttributeNS('http://www.w3.org/XML/1998/namespace', 'xml:space', 'preserve');
      is.appendChild(t); c.appendChild(is);
    });
  });

  const dim = doc.getElementsByTagNameNS(NS_MAIN, 'dimension')[0];
  if(dim) dim.setAttribute('ref', 'A1:G' + Math.max(last + entries.length, 5));
  zipPut(shE, ser(doc));

  // Excel recalculates every formula on open, so the device tabs' Last dates
  // pick the new rows up the first time anyone opens the file
  let calc = wbDoc.getElementsByTagNameNS(NS_MAIN, 'calcPr')[0];
  if(!calc){
    calc = wbDoc.createElementNS(NS_MAIN, 'calcPr');
    wbDoc.documentElement.appendChild(calc);
  }
  calc.setAttribute('fullCalcOnLoad', '1');
  zipPut(wbE, ser(wbDoc));

  const out = XLSX.CFB.write(cfb, {fileType: 'zip', type: 'array', compression: true});
  return out instanceof Uint8Array ? out : new Uint8Array(out);
}



</script>
