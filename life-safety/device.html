<style>
:root{
  color-scheme: light dark;
  --ink:#141a26; --muted:#5b6474; --line:#d9dde4; --bg:#f4f5f7; --card:#fff;
  --navy:#1f2a44; --navy-2:#2b3a5e; --red:#c8102e; --amber:#f2a900; --green:#1e7a46; --grey:#6b7280;
  --red-bg:#fde8eb; --amber-bg:#fff4d6; --green-bg:#e3f3e9; --grey-bg:#eceef2;
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#e8ebf1; --muted:#9aa3b2; --line:#2c3445; --bg:#0f141d; --card:#171e2a;
         --red-bg:#3a1a20; --amber-bg:#3a3018; --green-bg:#16301f; --grey-bg:#232a37; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.45}
a{color:inherit}
header.top{background:var(--navy);color:#fff}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.top-in img{width:30px;height:30px;border-radius:6px;background:#fff;flex:none}
.top-in b{display:block;font-size:16px;line-height:1.15}
.top-in small{display:block;font-size:12px;opacity:.75}
.top-in a.all{margin-left:auto;color:#fff;font-size:14px;opacity:.85;white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:16px}
.msg{padding:28px 0;color:var(--muted);text-align:center}

.kind{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
h1{font-size:40px;line-height:1;margin:4px 0 6px}
.loc{font-size:17px}
.sub{font-size:14px;color:var(--muted);margin-top:2px}

.verdict{margin:16px 0 14px;border-radius:14px;padding:14px 16px;border:2px solid;display:flex;gap:12px;align-items:center}
.verdict .ic{font-size:30px;line-height:1;flex:none;width:36px;text-align:center}
.verdict b{font-size:22px;display:block;line-height:1.15}
.verdict span{font-size:15px}
.ok   {--c:var(--green);--cb:var(--green-bg)}
.soon {--c:var(--amber);--cb:var(--amber-bg)}
.over {--c:var(--red);  --cb:var(--red-bg)}
.unknown{--c:var(--grey);--cb:var(--grey-bg)}
.verdict{border-color:var(--c);background:var(--cb)}

.photos{display:flex;gap:8px;margin:0 0 14px}
.photos a{flex:1;display:block;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--card);position:relative;max-width:50%}
.photos img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.photos span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 7px;border-radius:6px}

h2{font-size:15px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:20px 0 8px}
.check{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.check .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.check .n{font-weight:600}
.chip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--c);color:#fff;white-space:nowrap}
.soon .chip{color:#111}
.check .d{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:14px;margin-top:4px}
.check .d small{display:block;color:var(--muted);font-size:12px}
.check .ref{font-size:12px;color:var(--muted);margin-top:4px}

table.hist{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hist th,.hist td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.hist th{font-size:12px;color:var(--muted);font-weight:600}
.hist tr:last-child td{border-bottom:none}
.hist .fail{color:var(--red);font-weight:700}
.hist .pass{color:var(--green);font-weight:700}
.hist td.dt{white-space:nowrap}
.hist .note{font-size:13px;color:var(--muted)}
.docs a{display:inline-block;margin:0 8px 8px 0;padding:9px 14px;border-radius:9px;background:var(--navy);color:#fff;text-decoration:none;font-size:15px}

.asof{margin-top:20px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.asof a{color:var(--muted)}

/* all-devices list */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}
.sum div{background:var(--cb);border:1.5px solid var(--c);border-radius:10px;padding:8px;text-align:center}
.sum b{display:block;font-size:24px;line-height:1.1}
.sum span{font-size:12px}
.list{display:grid;gap:6px;grid-template-columns:minmax(0,1fr)}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:8px 10px;text-decoration:none}
.row b{min-width:50px}
.row .l{flex:1;min-width:0;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>

function cellDate(v){
  if(v == null || v === '') return null;
  if(v instanceof Date && !isNaN(v)) return iso(new Date(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate())));
  if(typeof v === 'number'){ const d = new Date(Math.round((v-25569)*86400000)); return isNaN(d) ? null : iso(d); }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(m) return iso(new Date(Date.UTC(+m[3], +m[1]-1, +m[2])));

// Same reading rules as the full tracker: a header row with "XX #", every Last/Next

function parse(wb){

    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:''});

    for(let i = 0; i < rows.length && hi < 0; i++)

    const h = rows[hi].map(x => String(x).trim().toLowerCase());
    const col = n => h.indexOf(n);
    const pairs = [];

      const m = x.match(/^next\s+(.+)$/); if(!m) return;
      const li = col('last ' + m[1].trim()); if(li < 0) return;
      pairs.push({name: m[1].trim().replace(/\b\w/g, c => c.toUpperCase()), ni:i, li});
    });
    const sub = ['type','model','serial number'].map(col);
    for(let i = hi+1; i < rows.length; i++){
      const r = rows[i], id = String(r[col(TABS[type].toLowerCase())] ?? '').trim().toUpperCase();
      if(!/^(FE|EL|EW|AED)\d+$/.test(id)) continue;
      out[id] = {type, location: String(r[col('near location')] ?? '').trim(),
        detail: sub.filter(j => j >= 0 && r[j] !== '').map((j, k) => (h[j] === 'serial number' ? 'SN ' : '') + r[j]).join(' · '),
        checks: pairs.map(p => String(r[p.ni] ?? '').trim().toUpperCase() === 'N/A' ? null
                 : {name:p.name, last:cellDate(r[p.li]), next:cellDate(r[p.ni])}).filter(Boolean)};
    }
  });
  return out;
}

function readHistory(wb){
  const ws = wb.Sheets['Inspection History']; if(!ws) return [];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
  const hi = rows.findIndex(r => { const h = r.map(x => String(x).trim().toLowerCase()); return h.includes('device') && h.includes('date'); });
  if(hi < 0) return [];
  const h = rows[hi].map(x => String(x).trim().toLowerCase()), c = n => h.indexOf(n);
  return rows.slice(hi+1).map(r => ({date: cellDate(r[c('date')]), dev: String(r[c('device')] ?? '').trim().toUpperCase(),
    check: String(r[c('check')] ?? '').trim(), result: String(r[c('result')] ?? '').trim(),
    by: String(r[c('inspected by')] ?? '').trim(), note: String(r[c('notes')] ?? '').trim()}))
    .filter(x => x.date && x.dev);
}

function applyHistory(found, hist, wb){
  const iv = wb.Sheets['Intervals'];
  Object.values(ROUTINE).forEach(r => { const v = iv && iv[r.cell] && iv[r.cell].v; if(typeof v === 'number' && v > 0) r.days = v; });
  const latest = {}, who = {};
  hist.forEach(x => {
    if(x.result.toLowerCase() !== 'pass') return;
    const k = x.dev + '|' + x.check.toLowerCase();
    who[k + '|' + x.date] = x.by;
    if(!latest[k] || x.date > latest[k].date) latest[k] = x;
  });
  Object.entries(found).forEach(([id, d]) => d.checks.forEach(c => {
    const k = id + '|' + c.name.toLowerCase(), x = latest[k], r = ROUTINE[d.type];
    if(r && x && c.name.toLowerCase() === r.check.toLowerCase() && (!c.last || x.date > c.last)){
      c.last = x.date; c.next = iso(addDays(toDate(x.date), r.days));
    }
    c.by = c.last ? (who[k + '|' + c.last] || '') : '';
  }));
}

// Worst check wins; nearest due date breaks a tie.
function status(d){
  const RANK = {over:0, soon:1, ok:2};
  d.checks.forEach(c => {
    c.days = c.next ? days(TODAY, toDate(c.next)) : null;
    const win = SOON_BY[c.name] ?? SOON[d.type];
    c.status = c.days === null ? 'unknown' : c.days <= 0 ? 'over' : c.days <= win ? 'soon' : 'ok';
  });
  const dated = d.checks.filter(c => c.days !== null);
  if(!dated.length) return {status:'unknown', worst:null};
  const worst = dated.reduce((a,b) => RANK[b.status] !== RANK[a.status] ? (RANK[b.status] < RANK[a.status] ? b : a) : (b.days < a.days ? b : a));
  return {status: worst.status, worst};
}

const nice = n => (CHECKS[n] || [n])[0];
function dueText(c){
  if(c.days === null) return 'No date logged';
  if(c.days < 0) return Math.abs(c.days) + ' day' + (c.days === -1 ? '' : 's') + ' overdue';
  if(c.days === 0) return 'Due today';
  return 'Due in ' + c.days + ' day' + (c.days === 1 ? '' : 's');
}

function renderDevice(id, d, hist, asOf){
  const dev = DEVICES.find(x => x.id === id) || {};
  const {status: st, worst} = status(d);
  const icon = {ok:'✔', soon:'!', over:'✖', unknown:'?'}[st];
  const headline = st === 'ok' ? 'All required checks are current'
    : st === 'unknown' ? 'No inspection dates logged yet'
    : nice(worst.name) + ' — ' + dueText(worst).toLowerCase();
  const mine = hist.filter(x => x.dev === id).sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0).slice(0, 8);
  const photo = (suf, label) => `<a href="photos/${id}${suf}.jpg" target="_blank"><img src="photos/${id}${suf}.jpg" alt="${label}" loading="lazy" onerror="this.parentNode.remove()"><span>${label}</span></a>`;
  document.title = id + ' — ' + LABEL[st] + ' · Atomic Industries';
  document.getElementById('main').innerHTML = `
    <div class="kind">${esc(KIND[d.type])}</div>
    <h1>${esc(id)}</h1>
    <div class="loc">${esc(d.location || dev.loc || '')}</div>
    ${d.detail ? `<div class="sub">${esc(d.detail)}</div>` : ''}
    <div class="verdict ${st}"><div class="ic">${icon}</div><div><b>${LABEL[st]}</b><span>${esc(headline)}</span></div></div>
    <div class="photos">${photo('', 'Unit')}${photo('-loc', 'Location')}</div>
    ${DOCS[id] ? `<div class="docs">${DOCS[id].map(([n,u]) => `<a href="${u}" target="_blank">📄 ${esc(n)}</a>`).join('')}</div>` : ''}
    <h2>Required checks</h2>
    ${d.checks.map(c => {
      const cons = CONSUMABLE.has(c.name);
      return `<div class="check ${c.status}"><div class="t"><span class="n">${esc(nice(c.name))}</span><span class="chip">${LABEL[c.status]}</span></div>
      <div class="d"><div><small>${cons ? 'Installed' : 'Last done'}</small>${!c.last && c.next && /internal|hydro/i.test(c.name) ? 'None yet (counted from mfd. date)' : fmt(c.last)}${c.by ? ' · ' + esc(c.by) : ''}</div>
      <div><small>${cons ? 'Replace by' : 'Next due'}</small>${fmt(c.next)}</div></div>
      <div class="ref">${esc(dueText(c))} · ${esc((CHECKS[c.name] || [,''])[1])}</div></div>`;
    }).join('') || '<div class="msg">No checks set up for this device.</div>'}
    <h2>Recent inspections</h2>
    ${mine.length ? `<table class="hist"><tr><th>Date</th><th>Check</th><th>Result</th><th>By</th></tr>${mine.map(x => `
      <tr><td class="dt">${short(x.date)}</td><td>${esc(nice(x.check))}${/fail/i.test(x.result) && x.note ? `<div class="note">${esc(x.note)}</div>` : ''}</td>
      <td class="${/pass/i.test(x.result) ? 'pass' : /fail/i.test(x.result) ? 'fail' : ''}">${esc(x.result)}</td><td>${esc(x.by || '—')}</td></tr>`).join('')}</table>`
      : '<div class="msg">No inspections on record yet.</div>'}
    <div class="asof">${asOf}<br><a href="./#${encodeURIComponent(id)}">Show ${esc(id)} on the plant map</a> (large page)</div>`;
}

function renderList(found, asOf){
  const rows = DEVICES.map(x => ({...x, st: found[x.id] ? status(found[x.id]).status : 'unknown'}));
  const n = k => rows.filter(r => r.st === k).length;
  document.getElementById('main').innerHTML = `
    <div class="kind">All life safety devices</div><h1 style="font-size:28px">${rows.length} devices</h1>
    <div class="sum">${['over','soon','ok','unknown'].map(k => `<div class="${k}"><b>${n(k)}</b><span>${LABEL[k]}</span></div>`).join('')}</div>
    ${Object.keys(KIND).map(t => `<h2>${KIND[t]}s</h2><div class="list">${rows.filter(r => r.type === t).map(r => `
      <a class="row ${r.st}" href="device.html?${r.id}"><b>${r.id}</b><span class="l">${esc((found[r.id] || {}).location || r.loc)}</span><span class="chip">${LABEL[r.st]}</span></a>`).join('')}</div>`).join('')}
    <div class="asof">${asOf}</div>`;
}

(async function(){
  // ?FE7, ?id=FE7 and #FE7 all work, so a label printed either way still scans.
  const q = decodeURIComponent((location.search.slice(1).replace(/^id=/i, '') || location.hash.slice(1)).split('&')[0]).trim().toUpperCase();
  const main = document.getElementById('main');
  let wb = null, modified = null;
  for(const name of WORKBOOKS){
    try{
      const res = await fetch(encodeURI(name), {cache:'no-store'});
      if(!res.ok) continue;
      modified = res.headers.get('last-modified');
      wb = XLSX.read(new Uint8Array(await res.arrayBuffer()), {type:'array', cellDates:true});
      break;
    }catch(e){}
  }
  if(!wb){ main.innerHTML = '<div class="msg">Could not load the inspection log. Check your signal and try again.</div>'; return; }
  const found = parse(wb), hist = readHistory(wb);
  applyHistory(found, hist, wb);
  const latest = hist.reduce((m, x) => x.date > m ? x.date : m, '');
  const asOf = 'Live from the PM log' + (modified ? ', last updated ' + new Date(modified).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '') +
    (latest ? '. Latest inspection on record: ' + fmt(latest) + '.' : '.') + ' Checked ' + fmt(iso(TODAY)) + '.';
  if(!q){ document.getElementById('allLink').style.display = 'none'; renderList(found, asOf); return; }
  if(!found[q]){ main.innerHTML = `<div class="msg">No device called <b>${esc(q)}</b> in the log. <a href="device.html">See all devices</a>.</div>`; return; }
  renderDevice(q, found[q], hist, asOf);
})();
</script>
